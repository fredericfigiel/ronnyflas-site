regular:
  eyebrow: Please support with me
  heading: Regular charity actions from Ronny Flas
  causes:
  - key: The Smile Train
    photo_kind: smiletrain
    photo: /assets/img/dee777_d7e78d2176c147708561d4dd247888de~mv2.jpg
    photo_alt: The Smile Train
    text_html: 'Ronny Flas actively and regularly supports “The Smile Train” association whose vision is to give every child with a cleft the opportunity for a healthy, productive life.<br>More info on: <a href="https://www.smiletrain.org/our-cause">https://www.smiletrain.org/our-cause</a>'
  - key: CBM
    photo_kind: logo
    photo: /assets/img/dee777_ce207098a5ea4604afb897f7b2a6fb60~mv2.png
    photo_alt: CBM
    text_html: <p>Support with me CBM which is an international development and humanitarian organisation dedicated to improving the quality of life of persons with disabilities in the world's poorest countries.</p>
  - key: APRP 67
    photo_kind: photo
    photo: /assets/img/dee777_891c1c00a2a247dea7b410006b40798b~mv2.jpg
    photo_alt: APRP 67
    text_html: 'Support with me APRP 67 Association who takes care of abandoned or lost parrots.<br>Check out their website: <a href="https://aprp67.fr/">https://aprp67.fr/</a>'
  - key: Association Stéphane Lamart
    photo_kind: logo
    photo: /assets/img/dee777_e47b03b4144045c38c229945becb87c8~mv2.jpg
    photo_alt: Association Stéphane Lamart
    text_html: 'Support with me the "Association Stéphane Lamart".<br>Check out their website: <a href="https://www.associationstephanelamart.com/">https://www.associationstephanelamart.com/</a>'
  - key: Refuges de Saint Brès
    photo_kind: logo
    photo: /assets/img/dee777_fbcfa2a8d0c842bface4fa657c86dd65~mv2.jpg
    photo_alt: Refuge de Saint Brès pour équidés
    text_html: Support with me the horse shelter “Refuges de Saint Brès pour équidés” in France who needs help to create new spaces to welcome always more mistreated horses.
  - key: SPA de Tarbes
    photo_kind: logo
    photo: /assets/img/dee777_ec67bc0787474d1f964a7972bb708c16~mv2.png
    photo_alt: SPA Bigorre — Hautes Pyrénées (Tarbes)
    text_html: |-
      The SPA of Tarbes in France needs to gather an amount of 8000 € to be able to give veterinary cares to the massive arrivals of cats they have to face in this estival season...<br>
                Please support with me and make donations on their website: <a href="https://www.spatarbes.com/">https://www.spatarbes.com/</a> !!!
    text_html_2: 'À tout mes amis, aidez cette S.P.A. qui en a vraiment besoin ! Merci d''avance pour votre générosité !!!'
supports:
  eyebrow: Ronny Flas is always very concerned by the animal well being
  heading: He actively supports
  causes:
  - key: Fondation Brigitte Bardot
    photo_kind: logo
    photo: /assets/img/dee777_07b2a0d62cbb44fa9eecbcefb03a0f92~mv2.jpg
    photo_alt: Fondation Brigitte Bardot
    text_html: The Brigitte Bardot Foundation currently takes care of more than 7,000 animals, including nearly 3,800 farm animals and 1,000 equines, in its 3 shelters and partner structures that make up the Arche de BB. Brigitte Bardot has dedicated her life for the animals in need. “Cette grande dame” deserves our highest respect.
  - key: Animaux en Péril
    photo_kind: logo
    photo: /assets/img/dee777_fdebe4c5ac6f47a3bce5c1b78d4fd45b~mv2.png
    photo_alt: Animaux en péril
    text_html: The main mission of the association is to welcome and take care of farm animals and horses that have been mistreated or seriously neglected, as well as wandering animals.

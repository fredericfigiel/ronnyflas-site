    photo_kind: null
    photo: ''
    photo_alt: ''
    text_html: Ronny Flas supports “Le Parc Australien” for the financing of the transport to Australia of the pockets for baby kangaroos who survived the dramatic Australian fires. If you can, please do it too !!!
  - key: SRPA Eupen
    photo_kind: null
    photo: ''
    photo_alt: ''
    text_html: Ronny Flas officially supports the Animal Protection Agency of Eupen (SRPA Eupen). If you can, please do it too !!!
  - key: King Baudouin Foundation
    photo_kind: null
    photo: ''
    photo_alt: ''
    text_html: Ronny Flas officially supports the King Baudouin Foundation in order to finance respirators that are needed by hospitals to take care of people who have contracted the COVID-19 virus. If you can, please do it too !!!

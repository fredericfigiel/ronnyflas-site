meta:
  title: Food Business - Ronny Flas | Belgian chocolate & coffee
  description: >-
    Food companies in Belgium, Luxembourg, Germany, Romania and Russia, with own
    coffee and chocolate factories. Clients include companies such as Edeka,
    Carrefour, Auchan, Delhaize, Metro,...


    We sell our own products in many countries around the world and we can also work as facilitator for our clients looking for Private Labels in coffee and confectionery.

meta:
  title: Sport - Ronny Flas | ISKA World Champion
  description: Kick boxing and thai boxing world champion, karate full contact
    black belt 3rd degree. Trainer of world, European and Belgian champions.
    Actor in Desert Kickboxer (1992).

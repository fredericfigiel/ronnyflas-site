meta:
  title: Sport - Ronny Flas | ISKA World Champion
  description: Kick boxing and thai boxing world champion, karate full contact
    black belt 3rd degree. Trainer of world, European and Belgian champions.
    Actor in Desert Kickboxer (1992).
pagehead:
  eyebrow: ISKA World Champion
  title: Sport
  lede: Karate Full Contact · Kick boxing · Thai boxing · Kung Fu Wing Chun ·
    Trainer · Promoter · Film industry.
  photo: /assets/img/dee777_b3d9961ecd1e76ee775a431a39a1cba2.png
  photo_alt: ISKA World Champion
quote:
  eyebrow: My sport saying
  text: “No religion ! No racism ! No politics ! Just discipline and hard work !!!”
record:
  eyebrow: Disciplines
  heading: Fighting record
  specs:
    - key: Kick boxing
      sub: World champion
      body_html: <ul class="chips"><li>ISKA World Champion.</li></ul>
    - key: Thai boxing
      sub: World champion
      body_html: |-
        <ul class="chips"><li>ISKA World Champion.</li></ul> 

        <ul class="chips"><li>MUAY THAI PIONEER IN BELGIUM.</li></ul>
    - key: Karate full contact
      sub: Black belt 3rd degree
      body_html: >-
        <ul class="chips"><li>First Karate teacher: Salvatore
        Scarlata.</li></ul>

         <ul class="chips"><li>Main trainer : Howard Brown (World Champions trainer).</li></ul>
    - key: Kung Fu Wing Chun
      sub: Good experience
      multiline: true
      body_html: >-
        <ul class="chips">
                    <li>Trained with Francois Toussaint (World Champion)</li>
                    <li>Trained with Hawking Cheung in Los Angeles</li>
                    <li>Ronny Flas taught Brandon Lee (son of Bruce Lee and main character of the movie “The Crow”) his first low kick at the Dany Innocento Academy (Los Angeles) !!!</li>
                  </ul>
coaching:
  eyebrow: Coaching
  heading: Trainer & promoter
  specs:
    - key: Trainer
      sub: Kickboxing · Thai boxing · Boxing · Dale Carnegie (Human relationship and
        psychology)
      body_html: <ul class="chips"><li>World champions</li><li>European
        champions</li><li>Belgian champions</li></ul>
    - key: Promoter
      sub: ""
      body_html: >-
        <ul class="chips"><li>Promoter of the first biggest international event
        of Muay Thai in Belgium.</li></ul>


        <ul class="chips"><li>Promoter of "LIVE BACK TO THAILAND AND JAPAN BY SATELLITE"</li></ul>
    - key: Personal trainer for
      sub: ""
      body_html: <ul class="chips"><li>VIP's & celebrities</li><li>Belgian
        police</li><li>Belgian military</li></ul>
    - key: Trainer certificates
      sub: ""
      body_html: <ul class="chips"><li>Thai boxing</li><li>Kick boxing</li><li>Karate
        full contact</li><li>Karate black belt 3rd degree diploma</li></ul>
    - key: Film industry
      sub: ""
      body_html: <ul class="chips"><li>Trainer for actor</li><li>Fight
        choreographer</li><li>Actor in “Desert Kickboxer” (1992)</li></ul>
  video_url: https://www.youtube.com/watch?v=wrXeVU0pgdE

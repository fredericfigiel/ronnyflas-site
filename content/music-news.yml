  - >-
    !!! GREAT NEWS !!!

    SILVA participated to the "Côte d'Or Festival Song" contest and made a real "raid" since he won the public prize and the jury prize for the "songwriter" category which was made up of professionals such as Jean-Félix Lalanne, Nathalie Marquay-Pernaut, Eric Jean Jean (RTL), Bruno Berberès (The Voice / TF1), Jean-Pierre Pasqualini (Melody),... The show was presented by Jerome Anthony (M6 / W9), chaired by Mario Barravecchia (Star Academy 1) and sponsored by Daniel Levi (The Ten Commandments).

    During this contest, SILVA performed his song "La Valse du destin" accompanied by her talented dancers Felipe Garcia and Caroline Givron, and the least we can say is that our national SILVA made a sensation in France !

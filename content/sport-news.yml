items:
- 'RONNY FLAS is currently coaching young warriors from various countries such as : Chechnya, Turkey, Morocco, Belgium,...'
- '"Everyday training is the key to keep in shape"'
- Here are some serious push up skills !!!! Respect !
- What is your level ??
- You are a V.I.P. and you need private lessons? => Contact Ronny !
- V + V = W as in World Champions ! 😊
- Ronny Flas is currently training special units of the police.
- Ronny Flas is always looking forward to share his sport experience with you !
- So, if you are an amateur or a professional fighter and you need advices from an experienced sportsman, don't hesitate to contact him !
- |-
  "ALWAYS THINK KUNG FU"
  Ronny Flas
- Don't forget your daily training !!! This is your best "self defense" against health issue !!! Be strong my friends !!!
- Stay in good shape to fight in 2021 ! Keep on training hard !!!
- Ronny Flas and legendary Thai Boxing Champion Krongsak met in Paris in order to prepare their common project !
- During his last stay in Thailand, Ronny Flas met his friend, the legendary undefeated Thai Boxing champion Krongsak. On the left of the picture, Dr J-L. Cabay, Ronny Flas's best friend and famous Belgian doctor specialised in sports who takes care of a lot of World champions and Olympic champions.
- Ronny Flas always likes to go back to his roots (as this is what he likes the most) and is still giving very exclusive personal training to VIP's.
- Ronny Flas recently gave a Muay Thai Boxing Workshop to German professional fighters in the Tai Kien Boxing Club in Aachen (Germany).

# Configuration de Decap CMS (interface d'administration du site).
# Générée par scripts internes puis figée ici : modifiez ce fichier
# uniquement si vous savez ce que vous faites (ou demandez à Claude).

backend:
  name: github
  repo: fredericfigiel/ronnyflas-site
  branch: main
  base_url: https://ronnyflas-cms-auth.gilles-piette.workers.dev
media_folder: assets/img
public_folder: /assets/img
locale: fr
collections:
- name: pages
  label: Pages du site
  files:
  - file: content/home.yml
    label: Accueil
    name: home
    fields:
    - label: Référencement
      name: meta
      widget: object
      fields:
      - label: Titre (onglet du navigateur)
        name: title
        widget: string
      - label: Description (SEO)
        name: description
        widget: text
    - label: En-tête (titre, photos, accroche)
      name: hero
      widget: object
      fields:
      - label: Accroche
        name: tagline
        widget: string
      - label: Photos (affichées côte à côte sous le titre)
        name: photos
        widget: list
        summary: '{{fields.photo_alt}}'
        min: 2
        max: 2
        fields:
        - label: Photo
          name: photo
          widget: image
        - label: Texte alternatif de la photo
          name: photo_alt
          widget: string
      - label: Rôles / liens (Sportsman, Music producer, etc.)
        name: roles
        widget: list
        summary: '{{fields.title}}'
        fields:
        - label: Titre
          name: title
          widget: string
        - label: Sous-titre
          name: sub
          widget: string
          required: false
        - label: Lien
          name: href
          widget: string
    - label: Bloc "Latest" (actualité en avant)
      name: latest
      widget: object
      fields:
      - label: Eyebrow (petit texte au-dessus du titre)
        name: eyebrow
        widget: string
      - label: Titre de section
        name: heading
        widget: string
      - label: Étiquette (tag)
        name: alert_tag
        widget: string
      - label: Titre de l'alerte
        name: alert_title
        widget: string
      - label: Paragraphes
        name: alert_paragraphs
        widget: list
        field:
          label: Paragraphe
          name: paragraph
          widget: markdown
          modes: [rich_text]
          buttons: [bold, italic, link]
      - label: Texte du bouton
        name: button_text
        widget: string
      - label: Lien du bouton
        name: button_href
        widget: string
    - label: Section "Sport · Music · Food Business · Charity"
      name: sections
      widget: object
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Titre
        name: heading
        widget: string
      - label: Les 4 cartes
        name: domains
        widget: list
        summary: '{{fields.title}}'
        collapsed: true
        fields:
        - label: Photo
          name: photo
          widget: image
        - label: Texte alternatif photo
          name: photo_alt
          widget: string
        - label: Style CSS avancé de la photo (laisser vide en général)
          name: photo_style
          widget: string
          required: false
        - label: Titre de la carte
          name: title
          widget: string
        - label: Description
          name: desc
          widget: text
        - label: Points clés
          name: facts
          widget: list
          field:
            label: Point
            name: fact
            widget: string
        - label: Texte du bouton
          name: button_text
          widget: string
        - label: Lien du bouton
          name: button_href
          widget: string
    - label: Section "Titles & credentials"
      name: honours
      widget: object
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Titre
        name: heading
        widget: string
      - label: Chiffres
        name: items
        widget: list
        summary: '{{fields.k}} — {{fields.v}}'
        fields:
        - label: 'Valeur courte (ex: ISKA, 4, 5)'
          name: k
          widget: string
        - label: Légende
          name: v
          widget: markdown
          modes: [rich_text]
          buttons: [bold, italic, link]
    - label: Bloc Contact (bas de page d'accueil)
      name: contact
      widget: object
      fields:
